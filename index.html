<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAF9F6;--card:#FFFFFF;--card2:#F3F0EB;--border:#DDD5C8;--text:#2D2420;--text2:#7A6E63;--accent:#7B2332;--accent2:#621A28;--gold:#C8A54E;--gold2:#B8943E;--green:#2D8A4E;--red:#C0392B;--yellow:#D4A017;--orange:#D97706}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:240px;min-height:100vh;background:var(--accent);border-right:none;padding:16px 0;position:fixed;top:0;left:0;overflow-y:auto;z-index:10}
.sidebar h1{font-family:'Playfair Display',Georgia,serif;font-size:20px;padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px;color:var(--gold);letter-spacing:.5px}
.sidebar .nav-item{padding:10px 16px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.7);transition:all .15s;border-left:3px solid transparent}
.sidebar .nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.sidebar .nav-item.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:var(--gold);font-weight:600}
.sidebar .nav-group{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.4);padding:16px 16px 6px}
.main{margin-left:240px;flex:1;padding:24px;min-height:100vh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.topbar h2{font-size:22px;font-weight:700;color:var(--accent)}
.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-danger{background:var(--red);color:#fff;opacity:.85}.btn-danger:hover{opacity:1}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--card2);color:var(--text)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
thead{background:var(--accent)}
th{padding:10px 12px;text-align:left;font-weight:600;color:rgba(255,255,255,.9);font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:8px 12px;border-top:1px solid var(--border);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:rgba(123,35,50,.04)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-green{background:rgba(45,138,78,.12);color:var(--green)}
.badge-red{background:rgba(192,57,43,.12);color:var(--red)}
.badge-yellow{background:rgba(212,160,23,.12);color:var(--yellow)}
.badge-blue{background:rgba(123,35,50,.1);color:var(--accent)}
.badge-orange{background:rgba(217,119,6,.12);color:var(--orange)}
.search-box{padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;width:280px}
.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(123,35,50,.1)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(45,36,32,.5);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:12px;padding:24px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:18px;margin-bottom:16px;color:var(--accent)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;color:var(--text2);font-weight:600}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(123,35,50,.1)}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:8px;padding:16px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-card .label{font-size:12px;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.green{color:var(--green)}.stat-card .value.red{color:var(--red)}.stat-card .value.blue{color:var(--accent)}.stat-card .value.orange{color:var(--orange)}
.month-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.month-tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;background:var(--card);border:1px solid var(--border);color:var(--text2);transition:all .15s}
.month-tab:hover{background:var(--card2);color:var(--text)}
.month-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.month-tab .count{font-size:11px;opacity:.7;margin-left:4px}
.scroll-table{overflow-x:auto;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.view-toggle{display:flex;gap:4px;background:var(--card);border-radius:6px;padding:3px;border:1px solid var(--border)}
.view-btn{padding:6px 12px;border-radius:4px;border:none;cursor:pointer;font-size:13px;background:transparent;color:var(--text2);transition:all .15s}
.view-btn:hover{color:var(--text)}.view-btn.active{background:var(--accent);color:#fff}
.view-btn:disabled{opacity:.4;cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-header{padding:8px;text-align:center;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase}
.cal-day{min-height:100px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:12px;position:relative;overflow:hidden}
.plan-grid{display:grid;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.plan-header{background:var(--accent);color:#fff;padding:8px 10px;font-size:12px;font-weight:700;text-align:center;border-right:1px solid rgba(255,255,255,.15);white-space:nowrap}
.plan-row-header{background:var(--card2);padding:8px 10px;font-size:12px;font-weight:600;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-cell{min-height:52px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px;position:relative;display:flex;flex-direction:column;gap:2px}
.plan-block{padding:3px 6px;border-radius:4px;font-size:10px;line-height:1.3;cursor:default;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-block.tour{background:rgba(123,35,50,.12);color:var(--accent);border-left:3px solid var(--accent)}
.plan-block.rental{background:rgba(217,119,6,.12);color:var(--orange);border-left:3px solid var(--orange)}
.plan-block.conflict{background:rgba(192,57,43,.15);color:var(--red);border-left:3px solid var(--red)}
.plan-free{color:var(--green);font-size:10px;opacity:.5;text-align:center;padding:4px}
.plan-week-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.plan-week-nav button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;color:var(--text)}
.plan-week-nav button:hover{background:var(--card2)}
.plan-week-nav .week-label{font-size:15px;font-weight:700;color:var(--accent)}
.plan-legend{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.plan-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.plan-legend-dot{width:12px;height:12px;border-radius:3px}
.cal-day.other-month{opacity:.3}
.cal-day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal-day .day-num{font-weight:700;color:var(--text2);margin-bottom:4px;font-size:13px}
.cal-event{background:rgba(123,35,50,.1);color:var(--accent);padding:2px 5px;border-radius:3px;margin-bottom:2px;font-size:11px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid var(--accent)}
.cal-event:hover{background:rgba(123,35,50,.18)}
.cal-event.night{background:rgba(139,92,246,.12);color:#7C3AED;border-left-color:#7C3AED}
.cal-event.walking{background:rgba(45,138,78,.1);color:var(--green);border-left-color:var(--green)}
@media(max-width:768px){.sidebar{width:60px}.sidebar h1,.sidebar .nav-group,.sidebar .nav-item span{display:none}.main{margin-left:60px}.form-grid{grid-template-columns:1fr}.cal-day{min-height:60px}}
</style>
</head>

function parseDateISO(s){if(!s)return null;const p=s.split('-');if(p.length===3)return new Date(+p[0],+p[1]-1,+p[2]);return null}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return fmtISO(d)}
function daysAhead(n){const d=new Date();d.setDate(d.getDate()+n);return fmtISO(d)}

function Modal({title,onClose,children}){
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="modal"><h3>{title}</h3>{children}</div>
  </div>
}
function ConfirmModal({msg,onConfirm,onCancel}){

function CalendarView({filtered,month,year,onEdit}){
  const firstDay=new Date(year,month-1,1);const lastDay=new Date(year,month,0);
  const startDow=(firstDay.getDay()+6)%7;const daysInMonth=lastDay.getDate();
  const prevMonthLast=new Date(year,month-1,0).getDate();
  const today=new Date();const todayStr=`${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push({day:prevMonthLast-startDow+1+i,other:true});
  for(let d=1;d<=daysInMonth;d++)cells.push({day:d,other:false});
  const rem=7-(cells.length%7);if(rem<7)for(let i=1;i<=rem;i++)cells.push({day:i,other:true});
  const toursByDay=useMemo(()=>{const m={};filtered.forEach(t=>{const d=parseDate(t.date);if(d){const k=d.getDate();if(!m[k])m[k]=[];m[k].push(t)}});return m},[filtered]);
  const dayNames=['Пон','Вто','Сря','Чет','Пет','Съб','Нед'];
  return <div className="cal-grid">
    {dayNames.map(d=><div key={d} className="cal-header">{d}</div>)}
    {cells.map((c,i)=>{
      const isToday=!c.other&&`${year}-${month-1}-${c.day}`===todayStr;
      const dayTours=c.other?[]:(toursByDay[c.day]||[]);
      return <div key={i} className={`cal-day${c.other?' other-month':''}${isToday?' today':''}`}>
        <div className="day-num">{c.day}</div>
        {dayTours.slice(0,3).map(t=><div key={t.id} className={`cal-event ${tourColor(t.tour)}`} title={`${t.tour}\n${t.name}\nГид: ${t.guide}`} onClick={()=>onEdit(t)}>

      </div>
    })}
  </div>
}

// ============= DASHBOARD =============
function Dashboard({tours,guides,fuel,carTasks}){
  const [preset,setPreset]=useState('all');
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');
  const applyPreset=(p)=>{setPreset(p);if(p==='7'){setDateFrom(daysAgo(3));setDateTo(daysAhead(4))}else if(p==='30'){setDateFrom(daysAgo(15));setDateTo(daysAhead(15))}else if(p==='90'){setDateFrom(daysAgo(45));setDateTo(daysAhead(45))}else{setDateFrom('');setDateTo('')}};
  const filtered=useMemo(()=>{if(!dateFrom&&!dateTo)return tours;const from=dateFrom?parseDateISO(dateFrom):null;const to=dateTo?parseDateISO(dateTo):null;
    return tours.filter(t=>{const d=parseDate(t.date);if(!d)return false;if(from&&d<from)return false;if(to&&d>to)return false;return true})},[tours,dateFrom,dateTo]);
  const monthStats=useMemo(()=>MONTHS.map((m,i)=>{const mt=filtered.filter(t=>t.month===i+1);
    return{name:m,tours:mt.length,pax:mt.reduce((a,t)=>a+(t.adults||0)+(t.children||0),0),rev:mt.reduce((a,t)=>a+(t.priceToUs||0),0),exp:mt.reduce((a,t)=>a+(t.totalExpenses||0),0)}}),[filtered]);
  const totRev=monthStats.reduce((a,m)=>a+m.rev,0);const totExp=monthStats.reduce((a,m)=>a+m.exp,0);
  const totPax=monthStats.reduce((a,m)=>a+m.pax,0);const totTours=filtered.length;
  const maxRev=Math.max(...monthStats.map(m=>m.rev),1);
  const openTasks=carTasks.filter(t=>t.status!=='ФИНАЛ').length;
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,flexWrap:'wrap',gap:12}}>
      <h2>Dashboard</h2>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <div className="view-toggle">
          <button className={`view-btn ${preset==='7'?'active':''}`} onClick={()=>applyPreset('7')}>7 дни</button>
          <button className={`view-btn ${preset==='30'?'active':''}`} onClick={()=>applyPreset('30')}>30 дни</button>
          <button className={`view-btn ${preset==='90'?'active':''}`} onClick={()=>applyPreset('90')}>90 дни</button>
          <button className={`view-btn ${preset==='all'?'active':''}`} onClick={()=>applyPreset('all')}>Всичко</button>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          <span style={{fontSize:12,color:'var(--text2)'}}>от</span>
          <input type="date" className="search-box" style={{width:150}} value={dateFrom} onChange={e=>{setDateFrom(e.target.value);setPreset('')}}/>
          <span style={{fontSize:12,color:'var(--text2)'}}>до</span>
          <input type="date" className="search-box" style={{width:150}} value={dateTo} onChange={e=>{setDateTo(e.target.value);setPreset('')}}/>
        </div>
        <span style={{fontSize:12,color:'var(--text2)',background:'var(--card)',padding:'4px 10px',borderRadius:4,border:'1px solid var(--border)'}}>{filtered.length} от {tours.length} тура</span>
      </div>
    </div>
    <div className="stats-row">
      <div className="stat-card"><div className="label">Турове</div><div className="value blue">{totTours}</div></div>
      <div className="stat-card"><div className="label">Туристи</div><div className="value">{totPax}</div></div>
      <div className="stat-card"><div className="label">Приходи</div><div className="value green">{totRev.toFixed(2)} €</div></div>
      <div className="stat-card"><div className="label">Разходи</div><div className="value red">{totExp.toFixed(2)} €</div></div>
      <div className="stat-card"><div className="label">Печалба</div><div className={`value ${totRev-totExp>=0?'green':'red'}`}>{(totRev-totExp).toFixed(2)} €</div></div>
      <div className="stat-card"><div className="label">Гидове</div><div className="value">{guides.length}</div></div>
      <div className="stat-card"><div className="label">Отворени задачи коли</div><div className={`value ${openTasks?'orange':''}`}>{openTasks}</div></div>
      {(()=>{const unreported=filtered.filter(t=>{const s=t.tourStatus||'reservation';return s==='reservation'||s==='done'});return unreported.length>0?<div className="stat-card"><div className="label">Неотчетени турове</div><div className="value orange">{unreported.length}</div></div>:null})()}
    </div>
    <div style={{background:'var(--card)',borderRadius:8,padding:20,border:'1px solid var(--border)'}}>
      <h3 style={{marginBottom:16,fontSize:16}}>Приходи по месеци</h3>
      <div style={{display:'flex',alignItems:'flex-end',gap:6,height:200}}>
        {monthStats.map((m,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
          <span style={{fontSize:11,color:'var(--text2)'}}>{m.rev?m.rev.toFixed(0)+'€':''}</span>
          <div style={{width:'100%',background:m.rev>0?'var(--accent)':'var(--card2)',borderRadius:'4px 4px 0 0',height:`${(m.rev/maxRev)*160}px`,minHeight:2,transition:'height .3s'}}/>
          <span style={{fontSize:10,color:'var(--text2)'}}>{m.name.slice(0,3)}</span>
        </div>)}
      </div>
    </div>
    <div style={{marginTop:20,display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
      <div style={{background:'var(--card)',borderRadius:8,padding:16,border:'1px solid var(--border)'}}>
        <h3 style={{fontSize:14,marginBottom:12}}>Топ доставчици</h3>
        {(()=>{const s={};filtered.forEach(t=>{if(t.supplier)s[t.supplier]=(s[t.supplier]||0)+1});return Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=><div key={k} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13}}><span>{k}</span><strong>{v}</strong></div>)})()}
      </div>
      <div style={{background:'var(--card)',borderRadius:8,padding:16,border:'1px solid var(--border)'}}>
        <h3 style={{fontSize:14,marginBottom:12}}>Топ турове</h3>
        {(()=>{const s={};filtered.forEach(t=>{if(t.tour){const n=t.tour.replace(/ - (English|Spanish|Italian|French|German|Portuguese|Russian)/,'');s[n]=(s[n]||0)+1}});return Object.entries(s).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=><div key={k} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13}}><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:250}}>{k}</span><strong>{v}</strong></div>)})()}
      </div>
    </div>
    {(()=>{const dayNames=['Пон','Вто','Сря','Чет','Пет','Съб','Нед'];const dayCounts=[0,0,0,0,0,0,0];
      filtered.forEach(t=>{const d=parseDate(t.date);if(d){dayCounts[(d.getDay()+6)%7]++}});const maxD=Math.max(...dayCounts,1);
      return <div style={{marginTop:20,background:'var(--card)',borderRadius:8,padding:20,border:'1px solid var(--border)'}}>
        <h3 style={{marginBottom:16,fontSize:16}}>Турове по ден от седмицата</h3>
        <div style={{display:'flex',alignItems:'flex-end',gap:8,height:180}}>
          {dayNames.map((name,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
            <span style={{fontSize:12,fontWeight:700}}>{dayCounts[i]}</span>
            <div style={{width:'100%',background:i>=5?'var(--orange)':'var(--accent)',borderRadius:'4px 4px 0 0',height:`${(dayCounts[i]/maxD)*140}px`,minHeight:2,transition:'height .3s'}}/>
            <span style={{fontSize:12,color:'var(--text2)',fontWeight:i>=5?700:400}}>{name}</span>
          </div>)}
        </div>
      </div>})()}
    {(()=>{const tourProfit={};filtered.forEach(t=>{if(!t.tour)return;const name=t.tour.replace(/ - (English|Spanish|Italian|French|German|Portuguese|Russian)/,'');
      if(!tourProfit[name])tourProfit[name]={rev:0,exp:0,count:0,pax:0};tourProfit[name].rev+=(t.priceToUs||0);tourProfit[name].exp+=(t.totalExpenses||0);tourProfit[name].count++;tourProfit[name].pax+=(t.adults||0)+(t.children||0)});
      const sorted=Object.entries(tourProfit).map(([name,d])=>({name,profit:d.rev-d.exp,rev:d.rev,exp:d.exp,count:d.count,pax:d.pax,avgProfit:d.count?(d.rev-d.exp)/d.count:0})).sort((a,b)=>b.profit-a.profit);
      const maxP=Math.max(...sorted.map(s=>Math.abs(s.profit)),1);

      const dayKey=t.date+'|'+t.tour.replace(/ - (English|Spanish|Italian|French|German|Portuguese|Russian)/,'');carData[car].days.add(dayKey);carData[car].tours++;carData[car].pax+=(t.adults||0)+(t.children||0);carData[car].rev+=(t.priceToUs||0);carData[car].exp+=(t.totalExpenses||0)});
      const sorted=Object.entries(carData).map(([car,d])=>({car,tourDays:d.days.size,bookings:d.tours,pax:d.pax,rev:d.rev,exp:d.exp,profit:d.rev-d.exp})).sort((a,b)=>b.tourDays-a.tourDays);
      const maxDays=Math.max(...sorted.map(s=>s.tourDays),1);
      return <div style={{marginTop:20,background:'var(--card)',borderRadius:8,padding:20,border:'1px solid var(--border)'}}>

        <p style={{fontSize:12,color:'var(--text2)',marginBottom:16}}>Тур-дни = уникални дни с тур. Резервации = общ брой записи.</p>

        <tbody>{sorted.map((c,i)=><tr key={i}><td style={{padding:'6px 8px',fontWeight:600}}>{c.car}</td><td style={{textAlign:'center',padding:'6px 8px',fontWeight:700,color:'var(--accent)'}}>{c.tourDays}</td><td style={{textAlign:'center',padding:'6px 8px'}}>{c.bookings}</td><td style={{textAlign:'center',padding:'6px 8px'}}>{c.pax}</td><td style={{textAlign:'right',padding:'6px 8px',color:'var(--green)'}}>{c.rev.toFixed(2)}</td><td style={{textAlign:'right',padding:'6px 8px',color:'var(--red)'}}>{c.exp.toFixed(2)}</td><td style={{textAlign:'right',padding:'6px 8px',fontWeight:700,color:c.profit>=0?'var(--green)':'var(--red)'}}>{c.profit.toFixed(2)}</td>
          <td style={{padding:'6px 8px'}}><div style={{background:'var(--card2)',borderRadius:3,height:8,overflow:'hidden'}}><div style={{width:`${(c.tourDays/maxDays)*100}%`,height:'100%',background:'var(--accent)',borderRadius:3}}/></div></td></tr>)}</tbody></table>
      </div>})()}
  </div>
}

// ============= TOUR CATALOG =============
function buildInitialCatalog(tours){
  const map={};let cid=1;
  tours.forEach(t=>{if(!t.tour)return;let name=t.tour,lang='';
    for(const l of['English','Spanish','Italian','French','German','Portuguese','Russian']){if(name.includes(' - '+l)){lang=l;name=name.replace(' - '+l,'');break}}
    if(!map[name])map[name]={id:cid++,name,languages:[],salePrice:null,childPrice:null,duration:'',needsCar:true,description:''};
    if(lang&&!map[name].languages.includes(lang))map[name].languages.push(lang);
    if(t.salePrice&&!map[name].salePrice)map[name].salePrice=t.salePrice;
    if(name.includes('WALKING'))map[name].needsCar=false;
  });return Object.values(map);
}

function CatalogPage({catalog,setCatalog}){
  const [search,setSearch]=useState('');const [editing,setEditing]=useState(null);const [delId,setDelId]=useState(null);
  const filtered=useMemo(()=>{const s=search.toLowerCase();return !s?catalog:catalog.filter(c=>c.name.toLowerCase().includes(s)||c.languages.join(',').toLowerCase().includes(s))},[catalog,search]);
  const blank={name:'',languages:[],salePrice:null,childPrice:null,duration:'',needsCar:true,description:''};
  const save=(form)=>{
    if(typeof form.languages==='string')form.languages=form.languages.split(',').map(s=>s.trim()).filter(Boolean);
    if(form.id){setCatalog(p=>p.map(c=>c.id===form.id?form:c))}else{setCatalog(p=>[...p,{...form,id:genId(p)}])};setEditing(null)};
  const del=()=>{setCatalog(p=>p.filter(c=>c.id!==delId));setDelId(null)};
  return <div>
    <div className="topbar"><h2>Каталог турове ({filtered.length})</h2><div style={{display:'flex',gap:8}}>
      <input className="search-box" placeholder="Търси..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <button className="btn btn-primary" onClick={()=>setEditing({...blank})}>+ Нов тур</button>
    </div></div>
    <div className="scroll-table"><table><thead><tr><th>Име на тур</th><th>Езици</th><th>Продажна цена €</th><th>Цена дете €</th><th>Продължителност</th><th>Кола</th><th>Описание</th><th></th></tr></thead>
    <tbody>{filtered.map(c=><tr key={c.id}><td><strong>{c.name}</strong></td>
      <td>{(c.languages||[]).map(l=><span key={l} className="badge badge-blue" style={{marginRight:3}}>{l}</span>)}</td>
      <td>{c.salePrice}</td><td>{c.childPrice}</td><td>{c.duration}</td>
      <td>{c.needsCar?<span className="badge badge-green">да</span>:<span className="badge badge-yellow">не</span>}</td>
      <td title={c.description} style={{maxWidth:200}}>{c.description}</td>
      <td style={{whiteSpace:'nowrap'}}><button className="btn btn-ghost btn-sm" onClick={()=>setEditing({...c,languages:(c.languages||[]).join(', ')})}>✎</button>{' '}
        <button className="btn btn-danger btn-sm" onClick={()=>setDelId(c.id)}>✕</button></td>
    </tr>)}</tbody></table></div>
    {editing&&<Modal title={editing.id?"Редактирай":"Нов тур в каталога"} onClose={()=>setEditing(null)}>
      <div><div className="form-grid">
        <div className="form-group full"><label>Име на тур</label><input value={editing.name} onChange={e=>setEditing(p=>({...p,name:e.target.value}))}/></div>
        <div className="form-group"><label>Езици (разделени с ,)</label><input value={editing.languages} onChange={e=>setEditing(p=>({...p,languages:e.target.value}))}/></div>
        <div className="form-group"><label>Продажна цена €</label><input type="number" step="0.01" value={editing.salePrice||''} onChange={e=>setEditing(p=>({...p,salePrice:+e.target.value||null}))}/></div>
        <div className="form-group"><label>Цена дете €</label><input type="number" step="0.01" value={editing.childPrice||''} onChange={e=>setEditing(p=>({...p,childPrice:+e.target.value||null}))}/></div>
        <div className="form-group"><label>Продължителност</label><input placeholder="Цял ден, Полудневен, Вечерен" value={editing.duration||''} onChange={e=>setEditing(p=>({...p,duration:e.target.value}))}/></div>
        <div className="form-group"><label>Нужна кола</label><select value={editing.needsCar?'да':'не'} onChange={e=>setEditing(p=>({...p,needsCar:e.target.value==='да'}))}><option>да</option><option>не</option></select></div>
        <div className="form-group full"><label>Описание</label><textarea rows={3} value={editing.description||''} onChange={e=>setEditing(p=>({...p,description:e.target.value}))}/></div>
      </div><div className="form-actions"><button className="btn btn-ghost" onClick={()=>setEditing(null)}>Отказ</button><button className="btn btn-primary" onClick={()=>save(editing)}>Запази</button></div></div>
    </Modal>}
    {delId&&<ConfirmModal msg="Изтрий тур от каталога?" onConfirm={del} onCancel={()=>setDelId(null)}/>}
  </div>
}



// ============= GUIDE DOSSIER =============
function GuideDossierPage({tours,guides,stopsGuide}){
  const [selectedGuide,setSelectedGuide]=useState(null);
  const [tab,setTab]=useState('overview');
  const [search,setSearch]=useState('');
  const [preset,setPreset]=useState('all');
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');
  const applyPreset=(p)=>{setPreset(p);if(p==='7'){setDateFrom(daysAgo(3));setDateTo(daysAhead(4))}else if(p==='30'){setDateFrom(daysAgo(15));setDateTo(daysAhead(15))}else if(p==='90'){setDateFrom(daysAgo(45));setDateTo(daysAhead(45))}else if(p==='year'){const y=new Date().getFullYear();setDateFrom(y+'-01-01');setDateTo(y+'-12-31')}else{setDateFrom('');setDateTo('')}};
  const filtered=useMemo(()=>{if(!dateFrom&&!dateTo)return tours;const from=dateFrom?parseDateISO(dateFrom):null;const to=dateTo?parseDateISO(dateTo):null;
    return tours.filter(t=>{const d=parseDate(t.date);if(!d)return false;if(from&&d<from)return false;if(to&&d>to)return false;return true})},[tours,dateFrom,dateTo]);

  // Build guide stats from filtered tours
  const guideStats=useMemo(()=>{
    const map={};
    filtered.forEach(t=>{
      const g=(t.guide||'').trim();
      if(!g)return;
      if(!map[g])map[g]={name:g,tours:[],tourDays:new Set(),bookings:0,pax:0,rev:0,expTotal:0,expGuide:0,languages:new Set(),suppliers:new Set(),cars:new Set()};
      const dayKey=t.date+'|'+(t.tour||'').replace(/ - (English|Spanish|Italian|French|German|Portuguese|Russian)/,'');
      map[g].tourDays.add(dayKey);
      map[g].bookings++;
      map[g].pax+=(t.adults||0)+(t.children||0);
      map[g].rev+=(t.priceToUs||0);
      map[g].expTotal+=(t.totalExpenses||0);
      map[g].expGuide+=(t.expGuide||0);
      map[g].tours.push(t);
      const lang=(t.tour||'').match(/ - (English|Spanish|Italian|French|German|Portuguese|Russian)$/);
      if(lang)map[g].languages.add(lang[1]);
      if(t.supplier)map[g].suppliers.add(t.supplier);
      if(t.carNumber)map[g].cars.add(t.carNumber);
    });
    // Merge with guides list for profile info
    return Object.values(map).map(g=>{
      const profile=guides.find(gp=>gp.name.trim()===g.name||g.name.includes(gp.name.trim()));
      return {...g,tourDays:g.tourDays.size,languages:[...g.languages],suppliers:[...g.suppliers],cars:[...g.cars],
        profile:profile||null,profit:g.rev-g.expTotal};
    }).sort((a,b)=>b.bookings-a.bookings);
  },[filtered,guides]);

  // Filtered by search
  const displayGuides=useMemo(()=>{
    if(!search)return guideStats;
    const s=search.toLowerCase();
    return guideStats.filter(g=>g.name.toLowerCase().includes(s)||g.languages.join(',').toLowerCase().includes(s));
  },[guideStats,search]);

  // Stops for selected guide
  const guideStops=useMemo(()=>{
    if(!selectedGuide)return [];
    return stopsGuide.filter(s=>{
      const sn=(s.guideName||'').trim().toLowerCase();
      const gn=selectedGuide.name.toLowerCase();
      return sn===gn||gn.includes(sn)||sn.includes(gn);
    });
  },[selectedGuide,stopsGuide]);

  // Monthly breakdown for selected guide
  const monthlyBreakdown=useMemo(()=>{
    if(!selectedGuide)return [];
    return MONTHS.map((m,i)=>{
      const mt=selectedGuide.tours.filter(t=>t.month===i+1);
      return {name:m.slice(0,3),tours:mt.length,rev:mt.reduce((a,t)=>a+(t.priceToUs||0),0),expGuide:mt.reduce((a,t)=>a+(t.expGuide||0),0)};
    });
  },[selectedGuide]);

  // Top tours for selected guide
  const topTours=useMemo(()=>{
    if(!selectedGuide)return [];
    const map={};
    selectedGuide.tours.forEach(t=>{
      const n=(t.tour||'').replace(/ - (English|Spanish|Italian|French|German|Portuguese|Russian)/,'');
      if(!n)return;
      if(!map[n])map[n]={count:0,rev:0,pax:0,expGuide:0};
      map[n].count++;map[n].rev+=(t.priceToUs||0);map[n].pax+=(t.adults||0)+(t.children||0);map[n].expGuide+=(t.expGuide||0);
    });
    return Object.entries(map).map(([name,d])=>({name,...d})).sort((a,b)=>b.count-a.count).slice(0,10);
  },[selectedGuide]);

  // Top suppliers for selected guide
  const topSuppliers=useMemo(()=>{
    if(!selectedGuide)return [];
    const map={};
    selectedGuide.tours.forEach(t=>{if(t.supplier){map[t.supplier]=(map[t.supplier]||0)+1}});
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  },[selectedGuide]);

  const maxBook=Math.max(...guideStats.map(g=>g.bookings),1);

  // Date filter bar component

      <span style={{fontSize:12,color:'var(--text2)'}}>от</span>
      <input type="date" className="search-box" style={{width:150}} value={dateFrom} onChange={e=>{setDateFrom(e.target.value);setPreset('')}}/>

      <input type="date" className="search-box" style={{width:150}} value={dateTo} onChange={e=>{setDateTo(e.target.value);setPreset('')}}/>

  </div>;

  if(selectedGuide){
    const g=guideStats.find(x=>x.name===selectedGuide.name)||selectedGuide;

        <div className="stat-card"><div className="label">Печалба</div><div className={`value ${g.profit>=0?'green':'red'}`}>{g.profit.toFixed(2)} €</div></div>

        </div>}
      </>}

        <tbody>{g.tours.sort((a,b)=>{const da=parseDate(a.date),db=parseDate(b.date);return da&&db?db-da:0}).map((t,i)=><tr key={i}>

          <td style={{textAlign:'center'}}>{(t.adults||0)+(t.children||0)}</td>

        </tr>)}</tbody></table></div>
      </div>}

      {tab==='stops'&&<div>
        {guideStops.length>0?<div className="scroll-table"><table><thead><tr><th>От</th><th>До</th><th>Гид</th></tr></thead>
        <tbody>{guideStops.map((s,i)=><tr key={i}><td>{s.startDate}</td><td>{s.endDate}</td><td>{s.guideName}</td></tr>)}</tbody></table></div>
        :<p style={{color:'var(--text2)',padding:20}}>Няма STOP записи за този гид</p>}
      </div>}
    </div>
  }

  // --- GUIDE LIST ---
  return <div>
    <div className="topbar"><h2>Досиета гидове ({guideStats.length} активни)</h2>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <input className="search-box" placeholder="Търси гид..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
    </div>
    <DateFilterBar/>
    <div style={{marginTop:16}} className="scroll-table"><table><thead><tr>
      <th>Гид</th><th>Езици</th><th style={{textAlign:'center'}}>Тур-дни</th><th style={{textAlign:'center'}}>Резервации</th><th style={{textAlign:'center'}}>Пакс</th>
      <th style={{textAlign:'right'}}>Приходи €</th><th style={{textAlign:'right'}}>Хонорар €</th><th style={{textAlign:'right'}}>Печалба €</th><th style={{width:'18%'}}>Натовареност</th><th></th>
    </tr></thead>
    <tbody>{displayGuides.map((g,i)=><tr key={i} style={{cursor:'pointer'}} onClick={()=>setSelectedGuide(g)}>
      <td><strong style={{color:'var(--accent)'}}>{g.name}</strong>{g.profile&&g.profile.drives==='да'&&<span style={{marginLeft:6,fontSize:10,color:'var(--green)'}}>🚗</span>}</td>
      <td style={{fontSize:12,color:'var(--text2)'}}>{g.languages.join(', ')}</td>
      <td style={{textAlign:'center',fontWeight:700}}>{g.tourDays}</td>
      <td style={{textAlign:'center'}}>{g.bookings}</td>
      <td style={{textAlign:'center'}}>{g.pax}</td>
      <td style={{textAlign:'right',color:'var(--green)'}}>{g.rev.toFixed(2)}</td>
      <td style={{textAlign:'right',color:'var(--orange)'}}>{g.expGuide.toFixed(2)}</td>
      <td style={{textAlign:'right',fontWeight:700,color:g.profit>=0?'var(--green)':'var(--red)'}}>{g.profit.toFixed(2)}</td>
      <td><div style={{background:'var(--card2)',borderRadius:3,height:8,overflow:'hidden'}}><div style={{width:`${(g.bookings/maxBook)*100}%`,height:'100%',background:'var(--accent)',borderRadius:3}}/></div></td>
      <td><button className="btn btn-ghost btn-sm" onClick={e=>{e.stopPropagation();setSelectedGuide(g)}}>Досие →</button></td>
    </tr>)}</tbody></table></div>
  </div>
}

// ============= FLEET / АВТОПАРК =============
function FleetPage({tours,fuel,fines,carTasks,stopsCarBus,vehicles,setVehicles}){
  const [selectedCar,setSelectedCar]=useState(null);
  const [tab,setTab]=useState('overview');
  const [serviceEditing,setServiceEditing]=useState(null);
  const [serviceRecords,setServiceRecords]=useState([]);
  const [delServiceId,setDelServiceId]=useState(null);
  const [vehicleEditing,setVehicleEditing]=useState(null);
  const [delVehicleId,setDelVehicleId]=useState(null);
  const [showRegistry,setShowRegistry]=useState(false);
  const [preset,setPreset]=useState('all');
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');
  const applyPreset=(p)=>{setPreset(p);if(p==='7'){setDateFrom(daysAgo(3));setDateTo(daysAhead(4))}else if(p==='30'){setDateFrom(daysAgo(15));setDateTo(daysAhead(15))}else if(p==='90'){setDateFrom(daysAgo(45));setDateTo(daysAhead(45))}else if(p==='year'){const y=new Date().getFullYear();setDateFrom(y+'-01-01');setDateTo(y+'-12-31')}else{setDateFrom('');setDateTo('')}};
  const filtered=useMemo(()=>{if(!dateFrom&&!dateTo)return tours;const from=dateFrom?parseDateISO(dateFrom):null;const to=dateTo?parseDateISO(dateTo):null;
    return tours.filter(t=>{const d=parseDate(t.date);if(!d)return false;if(from&&d<from)return false;if(to&&d>to)return false;return true})},[tours,dateFrom,dateTo]);

  // Build car registry from all data sources
  const cars=useMemo(()=>{
    const map={};
    // From tours
    filtered.forEach(t=>{
      const c=(t.carNumber||'').trim();
      const label=!c?'Без кола':c;
      if(!map[label])map[label]={name:label,tourDays:new Set(),bookings:0,pax:0,rev:0,exp:0,expGuide:0,expDriver:0,expFuel:0,expOther:0,tours:[]};
      const dayKey=t.date+'|'+(t.tour||'').replace(/ - (English|Spanish|Italian|French|German|Portuguese|Russian)/,'');
      map[label].tourDays.add(dayKey);
      map[label].bookings++;
      map[label].pax+=(t.adults||0)+(t.children||0);
      map[label].rev+=(t.priceToUs||0);
      map[label].exp+=(t.totalExpenses||0);
      map[label].expGuide+=(t.expGuide||0);
      map[label].expDriver+=(t.expDriver||0);
      map[label].expFuel+=(t.expFuel||0);
      map[label].expOther+=((t.expAudioGuide||0)+(t.expEntryFees||0)+(t.expLunch||0)+(t.expParking||0));
      map[label].tours.push(t);
    });
    // From carTasks
    carTasks.forEach(ct=>{const c=(ct.car||'').trim();if(c&&!map[c])map[c]={name:c,tourDays:new Set(),bookings:0,pax:0,rev:0,exp:0,expGuide:0,expDriver:0,expFuel:0,expOther:0,tours:[]}});
    // From fuel
    fuel.forEach(fl=>{const c=(fl.vehicle||'').trim();if(c&&!map[c])map[c]={name:c,tourDays:new Set(),bookings:0,pax:0,rev:0,exp:0,expGuide:0,expDriver:0,expFuel:0,expOther:0,tours:[]}});
    return Object.values(map).map(c=>({...c,tourDays:c.tourDays.size,profit:c.rev-c.exp})).sort((a,b)=>b.tourDays-a.tourDays);
  },[filtered,carTasks,fuel]);

  // Service records for selected car: from carTasks + stopsCarBus + user-added
  const carServices=useMemo(()=>{
    if(!selectedCar)return [];
    const items=[];
    // carTasks matching this car
    carTasks.forEach(ct=>{
      if((ct.car||'').trim()===selectedCar.name){
        items.push({id:'ct_'+ct.id,type:'task',date:ct.reportDate||'',description:ct.task,who:ct.reportedBy,priority:ct.priority,status:ct.status,cost:null,notes:ct.notes,source:'Задачи коли'});
      }
    });
    // stopsCarBus matching this car
    stopsCarBus.forEach(s=>{
      const v=(s.vehicle||'').toLowerCase();
      const cn=selectedCar.name.toLowerCase();
      if(cn.includes(v)||v.includes(cn.split(' ')[0].replace(/[^а-яa-z0-9]/gi,''))){
        items.push({id:'stop_'+s.id,type:'stop',date:s.startDate||'',dateTo:s.endDate||'',description:s.who,who:'',priority:'',status:'STOP',cost:null,notes:s.notes,source:'STOP Бус/Кола'});
      }
    });
    // User-added service records
    serviceRecords.filter(sr=>sr.carName===selectedCar.name).forEach(sr=>{
      items.push({...sr,source:'Ръчно добавен'});
    });
    return items;
  },[selectedCar,carTasks,stopsCarBus,serviceRecords]);

  // Fuel records for selected car
  const carFuel=useMemo(()=>{
    if(!selectedCar)return [];
    return fuel.filter(f=>{
      const v=(f.vehicle||'').toLowerCase();
      const cn=selectedCar.name.toLowerCase();
      return cn.includes(v)||v.includes(cn.split(' ')[0].replace(/[^а-яa-z0-9]/gi,''));
    });
  },[selectedCar,fuel]);

  // Fines for selected car
  const carFines=useMemo(()=>{
    if(!selectedCar)return [];
    return fines.filter(f=>{
      const v=(f.vehicle||'').toLowerCase().replace(/\s/g,'');
      const cn=selectedCar.name.toLowerCase().replace(/\s/g,'');
      return cn.includes(v)||v.includes(cn.split('-')[0].trim().replace(/[^а-яa-z0-9]/gi,''));
    });
  },[selectedCar,fines]);

  // Tours by month for selected car
  const monthlyBreakdown=useMemo(()=>{
    if(!selectedCar)return [];
    return MONTHS.map((m,i)=>{
      const mt=selectedCar.tours.filter(t=>t.month===i+1);
      return {name:m.slice(0,3),tours:mt.length,rev:mt.reduce((a,t)=>a+(t.priceToUs||0),0),exp:mt.reduce((a,t)=>a+(t.totalExpenses||0),0)};
    });

  // Top tours for this car
  const topTours=useMemo(()=>{
    if(!selectedCar)return [];

    setServiceEditing(null);
  };
  const delService=()=>{setServiceRecords(p=>p.filter(s=>s.id!==delServiceId));setDelServiceId(null)};

  const maxTD=Math.max(...cars.map(c=>c.tourDays),1);

  if(selectedCar){
    // --- CAR DOSSIER --- (re-lookup from live cars so filters apply)

    const totalServiceCost=carServices.reduce((a,s)=>a+(parseFloat(s.cost)||0),0)+carFines.reduce((a,f)=>a+(f.amountEur||0),0)+carFuel.reduce((a,f)=>a+(f.totalFuelCost||0),0);
    return <div>
      <div className="topbar">
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <button className="btn btn-ghost" onClick={()=>{setSelectedCar(null);setTab('overview')}}>← Назад</button>
          <h2>Досие: {c.name}</h2>
        </div>
        <button className="btn btn-primary" onClick={()=>setServiceEditing({...blankService})}>+ Добави сервизен запис</button>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:16}}>
        <div className="view-toggle">
          <button className={`view-btn ${preset==='7'?'active':''}`} onClick={()=>applyPreset('7')}>7 дни</button>

          <button className={`view-btn ${preset==='year'?'active':''}`} onClick={()=>applyPreset('year')}>Тази година</button>
          <button className={`view-btn ${preset==='all'?'active':''}`} onClick={()=>applyPreset('all')}>Всичко</button>

        </tr>)}</tbody></table></div>

          <div className="form-group"><label>Статус</label><select value={serviceEditing.status} onChange={e=>setServiceEditing(p=>({...p,status:e.target.value}))}><option value="">-</option><option>НОВО</option><option>В ПРОЦЕС</option><option>ФИНАЛ</option></select></div>
          <div className="form-group full"><label>Забележки</label><textarea rows={2} value={serviceEditing.notes} onChange={e=>setServiceEditing(p=>({...p,notes:e.target.value}))}/></div>
        </div><div className="form-actions"><button className="btn btn-ghost" onClick={()=>setServiceEditing(null)}>Отказ</button><button className="btn btn-primary" onClick={()=>saveService(serviceEditing)}>Запази</button></div></div>
      </Modal>}
      {delServiceId&&<ConfirmModal msg="Изтрий този сервизен запис?" onConfirm={delService} onCancel={()=>setDelServiceId(null)}/>}
    </div>
  }

  // --- VEHICLE REGISTRY ---
  const blankVehicle={name:'',seats:'',active:true};
  const saveVehicle=(form)=>{
    if(setVehicles){
      if(form.id){setVehicles(p=>p.map(v=>v.id===form.id?form:v))}
      else{setVehicles(p=>[...p,{...form,id:Math.max(0,...p.map(v=>v.id))+1}])}
    };setVehicleEditing(null);

    <div className="topbar"><h2>Автопарк ({cars.length} коли)</h2><button className="btn btn-ghost" onClick={()=>setShowRegistry(!showRegistry)}>{showRegistry?'Скрий':'🚐'} Регистър ({vList.length})</button>
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>

      <td style={{textAlign:'center'}}>{c.bookings}</td>
      <td style={{textAlign:'center'}}>{c.pax}</td>

      <td style={{textAlign:'right',color:'var(--red)'}}>{c.exp.toFixed(2)}</td>

      <td><div style={{background:'var(--card2)',borderRadius:3,height:8,overflow:'hidden'}}><div style={{width:`${(c.tourDays/maxTD)*100}%`,height:'100%',background:'var(--accent)',borderRadius:3}}/></div></td>
      <td><button className="btn btn-ghost btn-sm" onClick={e=>{e.stopPropagation();setSelectedCar(c)}}>Досие \u2192</button></td>
    </tr>)}</tbody></table></div>
  </div>
}

function CarRentalPage({rentals,setRentals,vehicles}){
  const [search,setSearch]=useState('');const [editing,setEditing]=useState(null);const [delId,setDelId]=useState(null);
  const calcDays=(from,to)=>{if(!from||!to)return 0;const a=new Date(from.split('.').reverse().join('-')),b=new Date(to.split('.').reverse().join('-'));const diff=Math.round((b-a)/(1000*60*60*24));return diff>0?diff:0};
  const filtered=useMemo(()=>{const s=search.toLowerCase();return !s?rentals:rentals.filter(r=>(r.client||'').toLowerCase().includes(s)||(r.vehicle||'').toLowerCase().includes(s)||(r.dateFrom||'').includes(s))},[rentals,search]);
  const totalRev=filtered.reduce((a,r)=>a+(r.totalPrice||0),0);
  const blank={dateFrom:'',dateTo:'',client:'',clientPhone:'',clientEmail:'',vehicle:'',pricePerDay:null,days:0,totalPrice:null,notes:''};
  const save=(form)=>{
    const days=calcDays(form.dateFrom,form.dateTo);
    const total=days*(form.pricePerDay||0);
    const updated={...form,days,totalPrice:Math.round(total*100)/100};
    if(form.id){setRentals(p=>p.map(r=>r.id===form.id?updated:r))}else{setRentals(p=>[...p,{...updated,id:genId(p)}])};setEditing(null)
  };
  const del=()=>{setRentals(p=>p.filter(r=>r.id!==delId));setDelId(null)};
  const vList=(vehicles||[]).filter(v=>v.active);
  return <div>
    <div className="topbar"><h2>Наем автомобил ({filtered.length})</h2><div style={{display:'flex',gap:8}}>
      <input className="search-box" placeholder="Търси клиент, кола..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <button className="btn btn-primary" onClick={()=>setEditing({...blank})}>+ Нов наем</button>
    </div></div>
    <div className="stats-row">
      <div className="stat-card"><div className="label">Наеми</div><div className="value blue">{filtered.length}</div></div>
      <div className="stat-card"><div className="label">Общо приход</div><div className="value green">{totalRev.toFixed(2)} €</div></div>
    </div>
    <div className="scroll-table"><table><thead><tr><th>Кола</th><th>Клиент</th><th>Телефон</th><th>От</th><th>До</th><th>Дни</th><th>€/ден</th><th>Общо €</th><th>Бележки</th><th></th></tr></thead>
    <tbody>{filtered.map(r=><tr key={r.id}>
      <td>{r.vehicle}</td><td><strong>{r.client}</strong></td><td>{r.clientPhone}</td>
      <td style={{whiteSpace:'nowrap'}}>{r.dateFrom}</td><td style={{whiteSpace:'nowrap'}}>{r.dateTo}</td>
      <td><strong>{r.days}</strong></td><td>{r.pricePerDay}</td>
      <td style={{fontWeight:700,color:'var(--green)'}}>{r.totalPrice}</td>
      <td title={r.notes} style={{maxWidth:150}}>{r.notes}</td>
      <td style={{whiteSpace:'nowrap'}}><button className="btn btn-ghost btn-sm" onClick={()=>setEditing({...r})}>✎</button>{' '}
        <button className="btn btn-danger btn-sm" onClick={()=>setDelId(r.id)}>✕</button></td>
    </tr>)}</tbody></table></div>
    {editing&&<Modal title={editing.id?"Редактирай наем":"Нов наем"} onClose={()=>setEditing(null)}>
      <CarRentalForm data={editing} onSave={save} onCancel={()=>setEditing(null)} vehicles={vList}/>
    </Modal>}
    {delId&&<ConfirmModal msg="Изтрий наем?" onConfirm={del} onCancel={()=>setDelId(null)}/>}
  </div>
}

// ============= PLANNING MODULE =============
function PlanningPage({tours,setTours,carRentals,vehicles,guides}){
  const now=new Date();
  const [viewMonth,setViewMonth]=useState(now.getMonth());
  const [viewYear,setViewYear]=useState(now.getFullYear());
  const [selectedDate,setSelectedDate]=useState(null);
  // Check if tour is fully planned: walking=guide only, car=car+guide+driver
  const isPlanned=(t)=>{
    const isWalking=t.tourType==='guide_only'||t.tourType==='walking';
    if(isWalking)return !!t.guide;
    return !!t.carNumber&&!!t.guide&&!!t.driver;
  };
  const autoStatus=(tour,updates)=>{
    const merged={...tour,...updates};
    const planned=isPlanned(merged);
    if(planned&&(!merged.tourStatus||merged.tourStatus==='reservation'))return{...updates,tourStatus:'planned'};
    if(!planned&&merged.tourStatus==='planned')return{...updates,tourStatus:'reservation'};
    return updates;
  };
  const assignCar=(tourId,carName)=>{setTours(prev=>prev.map(t=>{if(t.id!==tourId)return t;const u=autoStatus(t,{carNumber:carName});return{...t,...u}}));setPopover(null)};
  const assignGuide=(tourId,guideName)=>{setTours(prev=>prev.map(t=>{if(t.id!==tourId)return t;const u=autoStatus(t,{guide:guideName});return{...t,...u}}));setPopover(null)};
  const assignDriver=(tourId,driverName)=>{setTours(prev=>prev.map(t=>{if(t.id!==tourId)return t;const u=autoStatus(t,{driver:driverName});return{...t,...u}}));setPopover(null)};
  const [popover,setPopover]=useState(null); // {tourId,field:'car'|'guide'|'driver'}
  const popRef=React.useRef(null);
  const [driverInput,setDriverInput]=useState('');
  React.useEffect(()=>{if(!popover)return;const h=e=>{if(popRef.current&&!popRef.current.contains(e.target))setPopover(null)};document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h)},[popover]);
  React.useEffect(()=>{if(popover&&popover.field==='driver'){const t=tours.find(x=>x.id===popover.tourId);setDriverInput(t&&t.driver||'')}}, [popover]);
  const MNAMES=['Януари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];
  const DNAMES=['Пон','Вто','Сря','Чет','Пет','Съб','Нед'];

  const parseDate=(ds)=>{if(!ds)return null;if(ds.includes('.')){const p=ds.split('.');return new Date(+p[2],+p[1]-1,+p[0])}return new Date(ds)};
  const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  const inRange=(day,from,to)=>{if(!from||!to||!day)return false;return day.getTime()>=from.getTime()&&day.getTime()<=to.getTime()};
  const fmtD=(d)=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
  const isToday=(d)=>sameDay(d,now);
  const activeVehicles=(vehicles||[]).filter(v=>v.active);
  const activeGuides=(guides||[]).filter(g=>g.name);

  // Build calendar grid cells for the month
  const calendarDays=useMemo(()=>{
    const first=new Date(viewYear,viewMonth,1);
    let startDay=first.getDay()-1;if(startDay<0)startDay=6; // Monday=0
    const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
    const cells=[];
    // Previous month padding
    for(let i=0;i<startDay;i++){const d=new Date(viewYear,viewMonth,-(startDay-1-i));cells.push({date:d,inMonth:false})}
    // Current month
    for(let i=1;i<=daysInMonth;i++){cells.push({date:new Date(viewYear,viewMonth,i),inMonth:true})}
    // Next month padding to fill 6 rows
    while(cells.length<42){const d=new Date(viewYear,viewMonth+1,cells.length-startDay-daysInMonth+1);cells.push({date:d,inMonth:false})}
    return cells;
  },[viewMonth,viewYear]);

  // Index tours and rentals by date string for quick lookup
  const toursByDate=useMemo(()=>{
    const map={};
    tours.forEach(t=>{
      if(!t.date)return;const d=parseDate(t.date);if(!d)return;
      const k=d.toDateString();if(!map[k])map[k]=[];map[k].push(t);
    });
    return map;
  },[tours]);

  const rentalsByDate=useMemo(()=>{
    const map={};
    (carRentals||[]).forEach(r=>{
      if(!r.dateFrom)return;
      const from=parseDate(r.dateFrom),to=parseDate(r.dateTo||r.dateFrom);
      if(!from)return;
      // Expand each rental day
      const cur=new Date(from);const end=to||from;
      while(cur<=end){const k=cur.toDateString();if(!map[k])map[k]=[];map[k].push(r);cur.setDate(cur.getDate()+1)}
    });
    return map;
  },[carRentals]);

  const getDayData=(date)=>{
    const k=date.toDateString();
    const dayTours=toursByDate[k]||[];
    const dayRentals=rentalsByDate[k]||[];
    const noCar=dayTours.filter(t=>!t.carNumber);
    const noGuide=dayTours.filter(t=>!t.guide);
    // Busy vehicles
    const busyCars=new Set();
    dayTours.forEach(t=>{if(t.carNumber)busyCars.add(t.carNumber)});
    dayRentals.forEach(r=>{if(r.vehicle)busyCars.add(r.vehicle)});
    const freeCars=activeVehicles.filter(v=>!busyCars.has(v.name));
    // Busy guides
    const busyGuides=new Set();
    dayTours.forEach(t=>{if(t.guide)busyGuides.add(t.guide)});
    const freeGuides=activeGuides.filter(g=>!busyGuides.has(g.name));
    // Conflicts: vehicles used more than once
    const carUsage={};
    dayTours.forEach(t=>{if(t.carNumber){carUsage[t.carNumber]=(carUsage[t.carNumber]||0)+1}});
    dayRentals.forEach(r=>{if(r.vehicle){carUsage[r.vehicle]=(carUsage[r.vehicle]||0)+1}});
    const conflicts=Object.entries(carUsage).filter(([,c])=>c>1).map(([name])=>name);
    const planned=dayTours.filter(t=>isPlanned(t));
    const unplanned=dayTours.filter(t=>!isPlanned(t));
    // Free drivers (from guides who drive)
    const busyDrivers=new Set();
    dayTours.forEach(t=>{if(t.driver)busyDrivers.add(t.driver)});
    return{dayTours,dayRentals,noCar,noGuide,freeCars,freeGuides,conflicts,planned,unplanned,busyDrivers};
  };

  const prevMonth=()=>{if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1)}else setViewMonth(m=>m-1)};
  const nextMonth=()=>{if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1)}else setViewMonth(m=>m+1)};
  const goToday=()=>{setViewMonth(now.getMonth());setViewYear(now.getFullYear());setSelectedDate(now)};

  // Monthly totals
  const monthStats=useMemo(()=>{
    let t=0,r=0,pl=0,unpl=0,conf=0;
    calendarDays.filter(c=>c.inMonth).forEach(c=>{
      const dd=getDayData(c.date);
      t+=dd.dayTours.length;r+=dd.dayRentals.length;
      pl+=dd.planned.length;unpl+=dd.unplanned.length;
      conf+=dd.conflicts.length;
    });
    return{t,r,pl,unpl,conf};
  },[calendarDays,toursByDate,rentalsByDate,tours]);

  // Detail panel for selected date
  const selData=selectedDate?getDayData(selectedDate):null;

  const chipStyle=(bg,color)=>({display:'inline-block',padding:'2px 7px',borderRadius:10,fontSize:10,fontWeight:600,background:bg,color:color,marginRight:4});

  return <div>
    <div className="topbar"><h2>{'\u{1F4C5}'} Планиране</h2></div>
    <div className="stats-row">
      <div className="stat-card"><div className="label">Турове за {MNAMES[viewMonth]}</div><div className="value blue">{monthStats.t}</div></div>
      <div className="stat-card"><div className="label">Планирани</div><div className="value green">{monthStats.pl}</div></div>
      <div className="stat-card"><div className="label">Непланирани</div><div className="value" style={{color:monthStats.unpl>0?'var(--red)':'var(--green)'}}>{monthStats.unpl}</div></div>
      <div className="stat-card"><div className="label">Наеми</div><div className="value orange">{monthStats.r}</div></div>
      <div className="stat-card"><div className="label">Конфликти</div><div className="value" style={{color:monthStats.conf>0?'var(--red)':'var(--green)'}}>{monthStats.conf}</div></div>
    </div>

    <div style={{display:'flex',gap:20,alignItems:'flex-start'}}>
      {/* LEFT: Calendar */}
      <div style={{flex:'1 1 auto',minWidth:0}}>
        {/* Month nav */}
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
          <button className="btn btn-ghost btn-sm" onClick={prevMonth}>{'◀'}</button>
          <span style={{fontSize:18,fontWeight:700,color:'var(--accent)',minWidth:180,textAlign:'center'}}>{MNAMES[viewMonth]} {viewYear}</span>
          <button className="btn btn-ghost btn-sm" onClick={nextMonth}>{'▶'}</button>
          <button className="btn btn-ghost btn-sm" onClick={goToday} style={{marginLeft:8}}>Днес</button>
        </div>
        {/* Day headers */}
        <div className="cal-grid">
          {DNAMES.map(d=><div key={d} className="cal-header">{d}</div>)}
          {calendarDays.map((cell,i)=>{
            const dd=getDayData(cell.date);
            const total=dd.dayTours.length+dd.dayRentals.length;
            const hasIssue=dd.noCar.length>0||dd.noGuide.length>0||dd.conflicts.length>0;
            const isSel=selectedDate&&sameDay(selectedDate,cell.date);
            return <div key={i} className="cal-day" onClick={()=>setSelectedDate(new Date(cell.date))} style={{
              opacity:cell.inMonth?1:.35,
              cursor:'pointer',
              border:isSel?'2px solid var(--accent)':'1px solid var(--border)',
              background:isToday(cell.date)?'rgba(200,165,78,.1)':isSel?'rgba(123,35,50,.04)':'var(--card)',
              transition:'all .1s'
            }}>
              <div style={{fontWeight:isToday(cell.date)?800:600,fontSize:13,marginBottom:4,color:isToday(cell.date)?'var(--gold)':cell.date.getDay()===0?'var(--red)':'var(--text)'}}>
                {cell.date.getDate()}
              </div>
              {dd.planned.length>0&&<div style={chipStyle('rgba(45,138,78,.12)','var(--green)')}>{dd.planned.length} {'✓'}</div>}
              {dd.unplanned.length>0&&<div style={chipStyle('rgba(192,57,43,.1)','var(--red)')}>{dd.unplanned.length} {'?'}</div>}
              {dd.dayRentals.length>0&&<div style={chipStyle('rgba(217,119,6,.1)','var(--orange)')}>{dd.dayRentals.length} наем</div>}
              {dd.conflicts.length>0&&<div style={chipStyle('rgba(192,57,43,.12)','var(--red)')}>{'!'} конфл.</div>}
            </div>
          })}
        </div>
      </div>

      {/* RIGHT: Detail panel */}
      <div style={{width:380,minWidth:380,flexShrink:0,position:'sticky',top:24}}>
        {selectedDate&&selData?<div style={{background:'var(--card)',borderRadius:10,border:'1px solid var(--border)',boxShadow:'0 2px 8px rgba(0,0,0,.06)',overflow:'hidden'}}>
          {/* Date header */}
          <div style={{background:'var(--accent)',color:'#fff',padding:'14px 18px'}}>
            <div style={{fontSize:18,fontWeight:700}}>{fmtD(selectedDate)}</div>
            <div style={{fontSize:13,opacity:.8}}>{DNAMES[selectedDate.getDay()===0?6:selectedDate.getDay()-1]}, {MNAMES[selectedDate.getMonth()]}</div>
          </div>
          <div style={{padding:'16px 18px',maxHeight:'65vh',overflowY:'auto'}}>

            {/* Турове */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--accent)',marginBottom:8,borderBottom:'2px solid var(--accent)',paddingBottom:4}}>Турове ({selData.dayTours.length})</div>
              {selData.dayTours.length===0&&<div style={{fontSize:12,color:'var(--text2)',padding:'8px 0'}}>Няма турове за този ден</div>}
              {selData.dayTours.map((t,i)=>{const tp=isPlanned(t);const isWalk=t.tourType==='guide_only'||t.tourType==='walking';
              return <div key={i} style={{padding:'8px 10px',marginBottom:6,borderRadius:6,background:tp?'rgba(45,138,78,.04)':'var(--bg)',border:tp?'1px solid rgba(45,138,78,.25)':'1px solid var(--border)',fontSize:12}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                  <span style={{fontWeight:700}}>{t.tour||t.name||'Тур'}</span>
                  <span className={`badge ${tp?'badge-green':t.tourStatus==='conducted'?'badge-green':t.tourStatus==='cancelled'?'badge-red':'badge-yellow'}`} style={{fontSize:10}}>
                    {tp?'Планиран':t.tourStatus==='conducted'?'Проведен':t.tourStatus==='cancelled'?'Отказан':'Резервация'}
                  </span>
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:'4px 12px',color:'var(--text2)'}}>
                  <span>Клиент: <strong style={{color:'var(--text)'}}>{t.name||'—'}</strong></span>
                  {t.pickupTime&&<span>Час: <strong style={{color:'var(--text)'}}>{t.pickupTime}</strong></span>}
                  {isWalk&&<span className="badge badge-blue" style={{fontSize:9}}>Пешеходен</span>}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:4,marginTop:6}}>
                  {/* Кола */}
                  {!isWalk&&<div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontSize:11,color:'var(--text2)',minWidth:50}}>Кола:</span>
                    {t.carNumber?<span style={{display:'flex',alignItems:'center',gap:4}}>
                      <a href="#" onClick={e=>{e.preventDefault();setPopover({tourId:t.id,field:'car'})}} style={{color:'var(--green)',fontWeight:600,fontSize:11,textDecoration:'underline',textDecorationStyle:'dotted',cursor:'pointer'}}>{t.carNumber}</a>
                      <span onClick={()=>assignCar(t.id,'')} style={{color:'var(--red)',cursor:'pointer',fontSize:13,lineHeight:1}} title="Премахни">{'✕'}</span>
                    </span>:
                    <a href="#" onClick={e=>{e.preventDefault();setPopover({tourId:t.id,field:'car'})}} style={{color:'var(--red)',fontWeight:600,fontSize:11,textDecoration:'underline',cursor:'pointer'}}>{'✕'} Няма</a>}
                    {popover&&popover.tourId===t.id&&popover.field==='car'&&<div ref={popRef} style={{position:'absolute',right:10,zIndex:50,background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,.15)',padding:10,minWidth:220,maxHeight:200,overflowY:'auto',marginTop:2}}>
                      <div style={{fontSize:11,color:'var(--text2)',marginBottom:6,fontWeight:600}}>Свободни коли:</div>
                      {selData.freeCars.length===0&&<div style={{fontSize:11,color:'var(--red)'}}>Няма свободни</div>}
                      <div style={{display:'flex',flexDirection:'column',gap:3}}>
                        {selData.freeCars.map(v=><div key={v.id} onClick={()=>assignCar(t.id,v.name)} style={{padding:'5px 8px',borderRadius:5,cursor:'pointer',fontSize:11,background:'rgba(45,138,78,.06)',border:'1px solid rgba(45,138,78,.15)',color:'var(--green)',fontWeight:500}} onMouseEnter={e=>e.currentTarget.style.background='rgba(45,138,78,.15)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(45,138,78,.06)'}>{v.name}{v.seats?' ('+v.seats+')':''}</div>)}
                      </div>
                    </div>}
                  </div>}
                  {/* Гид */}
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontSize:11,color:'var(--text2)',minWidth:50}}>Гид:</span>
                    {t.guide?<span style={{display:'flex',alignItems:'center',gap:4}}>
                      <a href="#" onClick={e=>{e.preventDefault();setPopover({tourId:t.id,field:'guide'})}} style={{color:'var(--green)',fontWeight:600,fontSize:11,textDecoration:'underline',textDecorationStyle:'dotted',cursor:'pointer'}}>{t.guide}</a>
                      <span onClick={()=>assignGuide(t.id,'')} style={{color:'var(--red)',cursor:'pointer',fontSize:13,lineHeight:1}} title="Премахни">{'✕'}</span>
                    </span>:
                    <a href="#" onClick={e=>{e.preventDefault();setPopover({tourId:t.id,field:'guide'})}} style={{color:'var(--red)',fontWeight:600,fontSize:11,textDecoration:'underline',cursor:'pointer'}}>{'✕'} Няма</a>}
                    {popover&&popover.tourId===t.id&&popover.field==='guide'&&<div ref={popRef} style={{position:'absolute',right:10,zIndex:50,background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,.15)',padding:10,minWidth:200,maxHeight:200,overflowY:'auto',marginTop:2}}>
                      <div style={{fontSize:11,color:'var(--text2)',marginBottom:6,fontWeight:600}}>Свободни гидове:</div>
                      {selData.freeGuides.length===0&&<div style={{fontSize:11,color:'var(--red)'}}>Няма свободни</div>}
                      <div style={{display:'flex',flexDirection:'column',gap:3}}>
                        {selData.freeGuides.map(g=><div key={g.name} onClick={()=>assignGuide(t.id,g.name)} style={{padding:'5px 8px',borderRadius:5,cursor:'pointer',fontSize:11,background:'rgba(45,138,78,.06)',border:'1px solid rgba(45,138,78,.15)',color:'var(--green)',fontWeight:500}} onMouseEnter={e=>e.currentTarget.style.background='rgba(45,138,78,.15)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(45,138,78,.06)'}>{g.name}</div>)}
                      </div>
                    </div>}
                  </div>
                  {/* Шофьор */}
                  {!isWalk&&<div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontSize:11,color:'var(--text2)',minWidth:50}}>Шофьор:</span>
                    {t.driver?<span style={{display:'flex',alignItems:'center',gap:4}}>
                      <a href="#" onClick={e=>{e.preventDefault();setPopover({tourId:t.id,field:'driver'});setDriverInput(t.driver||'')}} style={{color:'var(--green)',fontWeight:600,fontSize:11,textDecoration:'underline',textDecorationStyle:'dotted',cursor:'pointer'}}>{t.driver}</a>
                      <span onClick={()=>assignDriver(t.id,'')} style={{color:'var(--red)',cursor:'pointer',fontSize:13,lineHeight:1}} title="Премахни">{'✕'}</span>
                    </span>:
                    <a href="#" onClick={e=>{e.preventDefault();setPopover({tourId:t.id,field:'driver'});setDriverInput('')}} style={{color:'var(--red)',fontWeight:600,fontSize:11,textDecoration:'underline',cursor:'pointer'}}>{'✕'} Няма</a>}
                    {popover&&popover.tourId===t.id&&popover.field==='driver'&&<div ref={popRef} style={{position:'absolute',right:10,zIndex:50,background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,boxShadow:'0 4px 16px rgba(0,0,0,.15)',padding:10,minWidth:200,marginTop:2}}>
                      <div style={{fontSize:11,color:'var(--text2)',marginBottom:6,fontWeight:600}}>Име на шофьор:</div>
                      <div style={{display:'flex',gap:4}}>
                        <input value={driverInput} onChange={e=>setDriverInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&driverInput.trim())assignDriver(t.id,driverInput.trim())}} placeholder="Въведи име..." style={{flex:1,padding:'5px 8px',borderRadius:5,border:'1px solid var(--border)',fontSize:11}} autoFocus/>
                        <button onClick={()=>{if(driverInput.trim())assignDriver(t.id,driverInput.trim())}} className="btn btn-primary btn-sm" style={{fontSize:10,padding:'4px 8px'}}>OK</button>
                      </div>
                    </div>}
                  </div>}
                </div>
              </div>})}
            </div>

            {/* Наеми */}
            {selData.dayRentals.length>0&&<div style={{marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--orange)',marginBottom:8,borderBottom:'2px solid var(--orange)',paddingBottom:4}}>Наеми ({selData.dayRentals.length})</div>
              {selData.dayRentals.map((r,i)=><div key={i} style={{padding:'8px 10px',marginBottom:6,borderRadius:6,background:'rgba(217,119,6,.04)',border:'1px solid rgba(217,119,6,.2)',fontSize:12}}>
                <div style={{fontWeight:700,marginBottom:3}}>{r.vehicle||'Кола'}</div>
                <div style={{color:'var(--text2)'}}>Клиент: <strong style={{color:'var(--text)'}}>{r.client||'—'}</strong></div>
                <div style={{color:'var(--text2)'}}>Период: {r.dateFrom} — {r.dateTo} ({r.days} дни) | <strong style={{color:'var(--green)'}}>{r.totalPrice} EUR</strong></div>
              </div>)}
            </div>}

            {/* Конфликти */}
            {selData.conflicts.length>0&&<div style={{marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--red)',marginBottom:8,borderBottom:'2px solid var(--red)',paddingBottom:4}}>{'!'} Конфликти</div>
              {selData.conflicts.map((c,i)=><div key={i} style={{padding:'8px 10px',marginBottom:4,borderRadius:6,background:'rgba(192,57,43,.06)',border:'1px solid rgba(192,57,43,.2)',fontSize:12,color:'var(--red)',fontWeight:600}}>
                {c} — използва се повече от веднъж!
              </div>)}
            </div>}

            {/* Свободни коли */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:700,color:'var(--green)',marginBottom:8,borderBottom:'2px solid var(--green)',paddingBottom:4}}>Свободни коли ({selData.freeCars.length})</div>
              {selData.freeCars.length===0?<div style={{fontSize:12,color:'var(--red)',padding:'4px 0'}}>Всички коли са заети!</div>:
              <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                {selData.freeCars.map(v=><span key={v.id} style={{padding:'3px 8px',borderRadius:6,background:'rgba(45,138,78,.08)',border:'1px solid rgba(45,138,78,.2)',fontSize:11,color:'var(--green)'}}>{v.name}</span>)}
              </div>}
            </div>

            {/* Свободни гидове */}
            <div>
              <div style={{fontSize:13,fontWeight:700,color:'var(--green)',marginBottom:8,borderBottom:'2px solid var(--green)',paddingBottom:4}}>Свободни гидове ({selData.freeGuides.length})</div>
              {selData.freeGuides.length===0?<div style={{fontSize:12,color:'var(--red)',padding:'4px 0'}}>Всички гидове са заети!</div>:
              <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                {selData.freeGuides.map(g=><span key={g.name} style={{padding:'3px 8px',borderRadius:6,background:'rgba(45,138,78,.08)',border:'1px solid rgba(45,138,78,.2)',fontSize:11,color:'var(--green)'}}>{g.name}</span>)}
              </div>}
            </div>

          </div>
        </div>:<div style={{background:'var(--card)',borderRadius:10,border:'1px solid var(--border)',padding:'40px 20px',textAlign:'center',color:'var(--text2)'}}>
          <div style={{fontSize:32,marginBottom:8}}>{'\u{1F447}'}</div>
          <div style={{fontSize:14}}>Кликни на ден от календара за детайли</div>
        </div>}
      </div>
    </div>
  </div>
}

// ============= MAIN APP =============
function App(){
  const [page,setPage]=useState('dashboard');
  const [guides,setGuides]=useState(INIT.guides);
  const [fuel,setFuel]=useState(INIT.fuel);
  const [stopsCarBus,setStopsCarBus]=useState(INIT.stopsCarBus);
  const [fines,setFines]=useState(INIT.fines);
  const [carTasks,setCarTasks]=useState(INIT.carTasks);
  const [stopsGuide,setStopsGuide]=useState(INIT.stopsGuide);
  const [tours,setTours]=useState(INIT.tours);
  const [catalog,setCatalog]=useState(()=>buildInitialCatalog(INIT.tours));
  const [carRentals,setCarRentals]=useState([]);
  const [vehicles,setVehicles]=useState(INIT.vehicles||[
    {id:1,name:'СВ 0470 ММ - H1бус',seats:'8+1',active:true},
    {id:2,name:'РВ 4806 ХС-Е класа',seats:'3+1',active:true},
    {id:3,name:'V class Silver РВ 2142 АЕ',seats:'6+1',active:true},
    {id:4,name:'РВ 7269 НХ - V-клас-ръчни скорости',seats:'6+1',active:true},
    {id:5,name:'РВ 8455 КС',seats:'8+1',active:true},
    {id:6,name:'Рено Трафик СВ 1455 РА',seats:'8+1',active:true},
    {id:7,name:'СВ 5702 ТЕ - V класа',seats:'6+1',active:true},
    {id:8,name:'РВ 9418 КС',seats:'8+1',active:true},
    {id:9,name:'Хюндай Елантра СВ0827ММ',seats:'3+1',active:true},
    {id:10,name:'Opel Insignia',seats:'3+1',active:true},
    {id:11,name:'V class NEW Silver',seats:'6+1',active:true},
    {id:12,name:'Външен транспорт',seats:'',active:true}
  ]);
  const navItems=[
    {id:'dashboard',label:'Dashboard',icon:'\u{1F4CA}'},
    {group:'ТУРОВЕ'},
    {id:'planning',label:'Планиране',icon:'\u{1F4C5}'},
    {id:'catalog',label:'Каталог турове',icon:'\u{1F4E6}'},
    {id:'tours',label:'Месечни турове',icon:'\u{1F5D3}'},
    {group:'ХОРА'},
    {id:'guides',label:'Гидове',icon:'\u{1F9D1}\u200d\u{1F3EB}'},
    {id:'guideDossier',label:'Досиета гидове',icon:'\u{1F4CB}'},
    {id:'stopsGuide',label:'STOP Гидове',icon:'\u{1F6AB}'},
    {group:'ТРАНСПОРТ'},
    {id:'fleet',label:'Автопарк',icon:'\u{1F697}'},
    {id:'carRental',label:'Наем автомобил',icon:'\u{1F511}'},
    {id:'fuel',label:'Гориво',icon:'\u26FD'},
    {id:'stopsCarBus',label:'STOP Бус/Кола',icon:'\u{1F690}'},
    {id:'carTasks',label:'Задачи коли',icon:'\u{1F527}'},
    {id:'fines',label:'Фишове',icon:'\u{1F4DD}'},
  ];
  const renderPage=()=>{
    switch(page){
      case 'dashboard': return <Dashboard tours={tours} guides={guides} fuel={fuel} carTasks={carTasks}/>;
      case 'planning': return <PlanningPage tours={tours} setTours={setTours} carRentals={carRentals} vehicles={vehicles} guides={guides}/>;
      case 'catalog': return <CatalogPage catalog={catalog} setCatalog={setCatalog}/>;
      case 'tours': return <ToursPage tours={tours} setTours={setTours} guides={guides} catalog={catalog} vehicles={vehicles}/>;
      case 'guides': return <GuidesPage guides={guides} setGuides={setGuides}/>;
      case 'guideDossier': return <GuideDossierPage tours={tours} guides={guides} stopsGuide={stopsGuide}/>;
      case 'fleet': return <FleetPage tours={tours} fuel={fuel} fines={fines} carTasks={carTasks} stopsCarBus={stopsCarBus} vehicles={vehicles} setVehicles={setVehicles}/>;
      case 'carRental': return <CarRentalPage rentals={carRentals} setRentals={setCarRentals} vehicles={vehicles}/>;
      case 'fuel': return <FuelPage fuel={fuel} setFuel={setFuel}/>;
      case 'stopsCarBus': return <StopsCarPage stops={stopsCarBus} setStops={setStopsCarBus}/>;
      case 'fines': return <FinesPage fines={fines} setFines={setFines}/>;
      case 'carTasks': return <CarTasksPage tasks={carTasks} setTasks={setCarTasks}/>;
      case 'stopsGuide': return <StopsGuidePage stops={stopsGuide} setStops={setStopsGuide}/>;
      default: return null;
    }
  };
  return <>
    <div className="sidebar">
      <h1>{'\u{1F30D}'} Zelanos Tours</h1>
      {navItems.map((item,i)=>item.group?<div key={i} className="nav-group">{item.group}</div>:
        <div key={item.id} className={`nav-item ${page===item.id?'active':''}`} onClick={()=>setPage(item.id)}>{item.icon} <span>{item.label}</span></div>
      )}
    </div>
    <div className="main">{renderPage()}</div>
  </>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
